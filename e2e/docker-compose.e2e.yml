services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vidfriends
      POSTGRES_PASSWORD: vidfriends
      POSTGRES_DB: vidfriends
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vidfriends"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin &&
      /usr/bin/mc mb myminio/vidfriends-videos --ignore-existing
      "

  backend:
    build:
      context: ../../vidflow
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      VIDFRIENDS_ADDR: ":8080"
      VIDFRIENDS_DATABASE_URL: "postgres://vidfriends:vidfriends@postgres:5432/vidfriends?sslmode=disable"
      VIDFRIENDS_LOG_LEVEL: "debug"
      VIDFRIENDS_JWT_SECRET: "vidfriends-e2e-secret"
      VIDFRIENDS_S3_ENDPOINT: "http://minio:9000"
      VIDFRIENDS_S3_ACCESS_KEY: "minioadmin"
      VIDFRIENDS_S3_SECRET_KEY: "minioadmin"
      VIDFRIENDS_S3_BUCKET: "vidfriends-videos"
      VIDFRIENDS_S3_USE_SSL: "false"
      VIDFRIENDS_ALLOW_PUBLIC_SIGNUP: "true"
      VIDFRIENDS_CORS_ORIGINS: "http://localhost:5173,http://localhost:4173"
    depends_on:
      createbuckets:
        condition: service_completed_successfully
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.18.2
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../vidflow/migrations:/migrations
    command:
      [
        "-path", "/migrations",
        "-database", "postgres://vidfriends:vidfriends@postgres:5432/vidfriends?sslmode=disable",
        "up"
      ]
    restart: on_failure
