# Mobile acceptance (M6-T6, FR-MOB-01, NFR-COMPAT-02): build the Android app from the Expo project,
# start the production stack in its plain-HTTP emulator variant (http://10.0.2.2:8880, a private
# address the app accepts with a warning, WF-PAIR-3), and run the Maestro flows in an emulator.
# iOS builds need macOS runners and Apple signing; they run through EAS once accounts exist (M6-T7).
name: Mobile

on:
  pull_request:
    paths:
      - apps/mobile/**
      - packages/contracts/**
      - packages/api-client/**
      - pnpm-lock.yaml
      - .github/workflows/mobile.yml
  workflow_dispatch:
    inputs:
      test_apk:
        description: 'Also build a test-signed arm64 APK for phones and upload it as an artifact'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  MAESTRO_VERSION: '2.11.0'

jobs:
  checks:
    name: Lint, typecheck, unit tests, bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@vidfriends/mobile^...
      - run: pnpm --filter @vidfriends/mobile lint
      - run: pnpm --filter @vidfriends/mobile typecheck
      - run: pnpm --filter @vidfriends/mobile test
      - name: Metro bundles for Android and iOS
        run: pnpm --filter @vidfriends/mobile bundle

  android-e2e:
    name: Android build and Maestro E2E
    # A test-APK dispatch only builds the APK.
    if: ${{ !inputs.test_apk }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      # The Gradle build (NDK, intermediates), two images and the emulator do not fit the runner's
      # default free disk (CI ran out of space in the worker image build). Drop unused toolchains.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@vidfriends/mobile^...
      - name: Generate the native Android project
        run: pnpm --filter @vidfriends/mobile exec expo prebuild --platform android --no-install
        env:
          CI: '1'
      # The Gradle project exists only after prebuild, so caching is set up here.
      - uses: gradle/actions/setup-gradle@v6
      # E2E builds only: a per-run PKCE verifier the app accepts for the `e2e` hand-off state, so
      # Maestro can sign in without a browser passkey (seed.mjs, ADR-0018). Releases never set it.
      - name: E2E hand-off verifier
        run: echo "E2E_HANDOFF_VERIFIER=$(openssl rand -base64 48 | tr '+/' '-_' | tr -d '=\n')" >> "$GITHUB_ENV"
      - name: Build the release APK (x86_64 for the emulator)
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
        env:
          EXPO_PUBLIC_E2E_HANDOFF_VERIFIER: ${{ env.E2E_HANDOFF_VERIFIER }}
      - name: Keep the APK, drop the Gradle build outputs
        run: |
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/vidfriends.apk"
          rm -rf apps/mobile/android/app/build apps/mobile/android/app/.cxx apps/mobile/android/build
          df -h /
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: server
          load: true
          tags: vidfriends-server:local
          cache-from: type=gha,scope=server
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: worker
          load: true
          tags: vidfriends-worker:local
          cache-from: type=gha,scope=worker
      # Plain http only on loopback (WF-PAIR-3): the emulator reaches it through `adb reverse`.
      - name: Start the stack (loopback HTTP variant)
        run: node e2e/scripts/stack.mjs up
        env:
          E2E_DOMAIN: http://localhost
          E2E_PUBLIC_URL: http://localhost:8880
          E2E_HTTP_PORT: '8880'
      - name: Seed
        run: |
          pnpm --filter @vidfriends/test-utils build
          node apps/mobile/e2e/seed.mjs >> "$GITHUB_ENV"
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | MAESTRO_VERSION="$MAESTRO_VERSION" bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Maestro flows on an Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r "$RUNNER_TEMP/vidfriends.apk"
            adb reverse tcp:8880 tcp:8880
            maestro test apps/mobile/e2e/main.yaml -e SERVER_URL="$SERVER_URL" -e JOIN_URL="$JOIN_URL" -e HANDOFF_CHALLENGE="$HANDOFF_CHALLENGE" -e MIA_TOKEN="$MIA_TOKEN" -e ADMIN_TOKEN="$ADMIN_TOKEN" -e VIDEO_URL="https://www.youtube.com/watch?v=ok&e2e=mobile" --format junit --output maestro-report.xml --debug-output maestro-debug --flatten-debug-output --test-output-dir maestro-debug || { adb exec-out screencap -p > maestro-debug/failure.png; maestro hierarchy > maestro-debug/hierarchy.json; exit 1; }
      - name: Stack logs
        if: failure()
        run: node e2e/scripts/stack.mjs logs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: maestro
          path: |
            maestro-report.xml
            maestro-debug/
          if-no-files-found: ignore
      - name: Stop the stack
        if: always()
        run: node e2e/scripts/stack.mjs down

  # A phone build for trying the app before store builds exist (owner request 2026-10-04): the same
  # release configuration, for 64-bit ARM phones, signed with the Android debug key. Uninstall it
  # before installing a build signed with the project key. Run: Actions → Mobile → Run workflow.
  test-apk:
    name: Test APK for phones (arm64)
    if: github.event_name == 'workflow_dispatch' && inputs.test_apk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@vidfriends/mobile^...
      - name: Generate the native Android project
        run: pnpm --filter @vidfriends/mobile exec expo prebuild --platform android --no-install
        env:
          CI: '1'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build the release APK (arm64)
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: Name and checksum
        run: |
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "vidfriends-test-${GITHUB_SHA::7}-arm64.apk"
          sha256sum vidfriends-test-*.apk | tee vidfriends-test.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: vidfriends-test-apk
          path: |
            vidfriends-test-*.apk
            vidfriends-test.sha256
          retention-days: 30
