# CI quality gate (NFR-MAINT-02, TDD §7): static checks, unit + contract + API integration tests
# against real PostgreSQL and S3, Docker image builds with Trivy, and Playwright E2E against the
# production images. `main` should require this workflow (branch protection, owner setting).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - name: Web bundle budget (NFR-PERF-04)
        run: pnpm --filter @vidfriends/web size
      - name: OpenAPI is up to date (NFR-MAINT-01)
        run: pnpm --filter @vidfriends/contracts gen:check
      - name: Environment reference is up to date (NFR-OPS-02)
        run: pnpm --filter @vidfriends/server env:docs --check
      - name: Merged migrations are immutable (NFR-REL-03)
        run: |
          base="origin/${{ github.base_ref || 'main' }}"
          if git rev-parse --verify --quiet "$base" >/dev/null; then
            node scripts/check-migrations.mjs --base "$base"
          else
            node scripts/check-migrations.mjs
          fi
      - name: Dependency audit (critical)
        run: pnpm audit --audit-level critical --prod

  test:
    name: Unit, contract and API tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      TEST_S3_ENDPOINT: http://localhost:8333
      TEST_S3_ACCESS_KEY_ID: ciaccesskey
      TEST_S3_SECRET_ACCESS_KEY: ci-secret-key-not-a-real-secret
    steps:
      - uses: actions/checkout@v7
      - name: Start SeaweedFS (S3)
        run: |
          printf '{"identities":[{"name":"ci","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' \
            "$TEST_S3_ACCESS_KEY_ID" "$TEST_S3_SECRET_ACCESS_KEY" > /tmp/s3.json
          docker run -d --name seaweedfs -p 8333:8333 -e WEED_MASTER_VOLUME_GROWTH_COPY_1=1 -v /tmp/s3.json:/etc/s3.json:ro chrislusf/seaweedfs:4.48 \
            server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/etc/s3.json -volume.max=1000 -master.volumeSizeLimitMB=1024
          for i in $(seq 1 60); do
            curl -sf http://localhost:8333/healthz >/dev/null &&
              docker exec seaweedfs wget -q -O - http://127.0.0.1:9333/dir/status | grep -q '"DataNodes":\[{' && break
            sleep 1
          done
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends ffmpeg
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  images:
    name: Images, Trivy and E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build server image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: server
          load: true
          tags: vidfriends-server:local
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
      - name: Build worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: worker
          load: true
          tags: vidfriends-worker:local
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
      - name: Trivy — fail on fixable critical vulnerabilities (NFR-SEC-07)
        run: |
          for image in vidfriends-server:local vidfriends-worker:local; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.75.0 \
              image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$image"
          done
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vidfriends/contracts --filter @vidfriends/test-utils build
      - name: Start the production stack
        run: pnpm --filter @vidfriends/e2e stack:up
      - name: Install Playwright Chromium
        run: pnpm --filter @vidfriends/e2e exec playwright install --with-deps chromium chrome
      - name: Playwright E2E (Chrome)
        run: pnpm --filter @vidfriends/e2e e2e
        env:
          E2E_CHROME_CHANNEL: '1'
      - name: Backup and restore drill (NFR-REL-04)
        run: e2e/scripts/restore-drill.sh
      - name: Stack logs
        if: failure()
        run: node e2e/scripts/stack.mjs logs
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: node e2e/scripts/stack.mjs down
