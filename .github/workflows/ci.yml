name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GO_VERSION: "1.26"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go test -race -count=1 -timeout 60s ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go build -ldflags="-s -w" -o /dev/null ./cmd/server

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t vidfriends-server .

  docker-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image for scanning
        run: docker build -t vidfriends-server:scan .
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.29.0
        with:
          image-ref: vidfriends-server:scan
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          hide-progress: true
        continue-on-error: true

  integration:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Start docker compose
        run: docker compose up --build --wait
        timeout-minutes: 5
      - name: Run integration tests
        run: go test -count=1 -tags=integration -timeout 120s ./test/integration/
        env:
          VIDFRIENDS_ADDR: "http://localhost:8080"
          VIDFRIENDS_DATABASE_URL: "postgres://vidfriends:vidfriends@localhost:5432/vidfriends?sslmode=disable"
          VIDFRIENDS_S3_ENDPOINT: "http://localhost:9000"
          VIDFRIENDS_S3_ACCESS_KEY: "minioadmin"
          VIDFRIENDS_S3_SECRET_KEY: "minioadmin"
          VIDFRIENDS_S3_BUCKET: "vidfriends-videos"
          VIDFRIENDS_S3_USE_SSL: "false"
      - name: Clean up
        run: docker compose down
        if: always()
