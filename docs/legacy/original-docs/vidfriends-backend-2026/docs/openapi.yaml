components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT access token obtained from /api/auth/login or /api/auth/register.
        Sent as `Authorization: Bearer <token>`.

        Access tokens expire after 15 minutes. Use /api/auth/refresh with a
        refresh token to obtain a new access token.

    AdminAuth:
      type: apiKey
      in: header
      name: X-Admin-Role
      description: |
        Admin endpoints require a user with `role: "admin"` in their JWT claims.
        This is enforced server-side; no extra header is needed beyond a valid
        Bearer token with admin role.

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message

    StatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string

    DeleteAccountRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          description: Current password for confirmation

    DeleteAccountResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    HealthResponse:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          type: string
          example: ok

    RegisterRequest:
      type: object
      required: [email, username, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        username:
          type: string
          minLength: 3
          maxLength: 30
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: Must contain at least one uppercase letter, one lowercase letter, and one digit
        display_name:
          type: string
        invite_code:
          type: string
          description: Required if public signup is disabled

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    AuthResponse:
      type: object
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          description: Access token TTL in seconds (typically 900)

    User:
      type: object
      required: [id, email, username, role, status, storage_used, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        username:
          type: string
        display_name:
          type: string
        avatar_url:
          type: string
          format: uri
        role:
          type: string
          enum: [user, admin]
        status:
          type: string
          enum: [active, suspended, disabled]
        storage_used:
          type: integer
          format: int64
        last_active_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    VideoResponse:
      type: object
      required: [id, user_id, title, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        file_url:
          type: string
          format: uri
        thumbnail_url:
          type: string
          format: uri
        duration:
          type: string
          description: Duration in seconds (as string)
        status:
          type: string
          enum: [ready, processing, deleted]
        source_url:
          type: string
          format: uri
        source_platform:
          type: string
        duplicate_group_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        like_count:
          type: integer
        comment_count:
          type: integer
        liked:
          type: boolean
        user_name:
          type: string
        is_canonical:
          type: boolean
          nullable: true
        canonical_info:
