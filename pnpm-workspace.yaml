packages:
  - apps/*
  - packages/*
  - e2e
onlyBuiltDependencies:
  - '@node-rs/argon2'
  - esbuild
  - sharp
  - unrs-resolver
overrides:
  # One React for the whole monorepo, at the version the Expo SDK pins (ADR-0017): duplicate React
  # versions break the mobile app at runtime.
  react: 19.2.3
  react-dom: 19.2.3
  # drizzle-kit's loader pins esbuild 0.18 (GHSA-67mh-4wv8-2f99, dev-only); the current esbuild
  # transform API is compatible (M5-T7 dependency audit).
  '@esbuild-kit/core-utils>esbuild': 0.28.2
