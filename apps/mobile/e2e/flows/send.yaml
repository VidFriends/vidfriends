# J-3: add a link, wait until it is processed, send it to Alex (auto-friend from the invite).
appId: io.github.vidfriends.app
---
- tapOn: 'Send'
- tapOn:
    id: send-url
- inputText: ${VIDEO_URL}
- hideKeyboard
- tapOn:
    id: send-add
- extendedWaitUntil:
    visible: 'Ready'
    timeout: 60000
- tapOn:
    id: send-friend-alex
- tapOn:
    id: send-note
- inputText: for you
- hideKeyboard
- tapOn:
    id: send-submit
- assertVisible: 'Sent to 1 friend.'
