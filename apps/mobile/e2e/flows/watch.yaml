# J-4/J-5: sign out, sign in as Alex on the same server, watch Mia's video, react and reply; Mia's
# answer arrives live (M7-T9).
appId: io.github.vidfriends.app
---
- tapOn: 'More'
- tapOn: 'Settings'
# FR-NOTIF-08 (ADR-0024): the native UnifiedPush module is linked; the emulator has no distributor.
- scrollUntilVisible:
    element:
      id: unifiedpush-none
- scrollUntilVisible:
    element:
      id: settings-signout
- tapOn:
    id: settings-signout
- assertVisible: 'Sign in with a passkey'
- runFlow:
    file: sign-in.yaml
    env:
      TOKEN: ${ADMIN_TOKEN}
- extendedWaitUntil:
    visible: 'From Mia'
    timeout: 30000
- assertVisible: 'for you'
- tapOn: 'React & reply'
- scrollUntilVisible:
    element:
      text: 'Fire'
- tapOn: 'Fire'
- scrollUntilVisible:
    element:
      id: reply-input
- tapOn:
    id: reply-input
- inputText: so good
- hideKeyboard
- scrollUntilVisible:
    element:
      id: reply-send
- tapOn:
    id: reply-send
# The new reply renders just above the input; swiping up from the top would open the
# notification shade instead.
- extendedWaitUntil:
    visible: 'so good'
    timeout: 10000
# M7-T9 / FR-NOTIF-06: Mia answers from her own device; the open conversation (which does not
# poll) shows it within seconds through the realtime stream.
- runScript:
    file: ../scripts/reply-as.js
    env:
      TOKEN: ${MIA_TOKEN}
      BODY: thanks alex
- extendedWaitUntil:
    visible: 'thanks alex'
    timeout: 8000
