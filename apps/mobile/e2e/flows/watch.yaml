# J-4/J-5: sign out, sign in as Alex on the same server, watch Mia's video, react and reply.
appId: io.github.vidfriends.app
---
- tapOn: 'More'
- tapOn: 'Settings'
- scrollUntilVisible:
    element:
      id: settings-signout
- tapOn:
    id: settings-signout
- assertVisible: 'Log in'
- scrollUntilVisible:
    element:
      id: login-username
- tapOn:
    id: login-username
- inputText: ${ADMIN_USER}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: login-password
- tapOn:
    id: login-password
- inputText: ${ADMIN_PASSWORD}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: login-submit
- tapOn:
    id: login-submit
- extendedWaitUntil:
    visible: 'From Mia'
    timeout: 30000
- assertVisible: 'for you'
- tapOn: 'React & reply'
- scrollUntilVisible:
    element:
      text: 'Fire'
- tapOn: 'Fire'
- scrollUntilVisible:
    element:
      id: reply-input
- tapOn:
    id: reply-input
- inputText: so good
- hideKeyboard
- scrollUntilVisible:
    element:
      id: reply-send
- tapOn:
    id: reply-send
# The new reply renders just above the input; swiping up from the top would open the
# notification shade instead.
- extendedWaitUntil:
    visible: 'so good'
    timeout: 10000
