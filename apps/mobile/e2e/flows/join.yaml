# J-2: pair by pasting the join link (no default server, ADR-0014); the join screen hands over
# to the server's page to create the account and passkey, then the app is signed in.
appId: io.github.vidfriends.app
---
- assertVisible: 'Connect to your server'
- tapOn:
    id: pair-input
- inputText: ${JOIN_URL}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: pair-connect
- tapOn:
    id: pair-connect
- extendedWaitUntil:
    visible: 'Join Mobile E2E'
    timeout: 15000
- assertVisible: 'Alex invited you.'
- assertVisible: 'Continue to create your account'
- runFlow:
    file: sign-in.yaml
    env:
      TOKEN: ${MIA_TOKEN}
- extendedWaitUntil:
    visible: 'Nothing here yet'
    timeout: 20000
