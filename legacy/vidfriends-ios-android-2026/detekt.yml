build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: true

processors:
  active: true
  exclude:
    - "FunctionCountProcessor"
    - "PropertyCountProcessor"
    - "ClassCountProcessor"
    - "PackageCountProcessor"

console-reports:
  active: true
  exclude:
    - "ProjectStatisticsReport"
    - "ComplexityReport"
    - "NotificationReport"
    - "FindingsReport"
    - "FileBasedInfoReport"

output-reports:
  active: true

comments:
  active: true
  CommentOverPrivateFunction:
    active: false
  CommentOverPrivateProperty:
    active: false
  EndOfSentenceFormat:
    active: false
  UndocumentedPublicClass:
    active: true
  UndocumentedPublicFunction:
    active: true

complexity:
  active: true
  ComplexCondition:
    threshold: 4
  ComplexInterface:
    threshold: 15
  CyclomaticComplexMethod:
    threshold: 15
  LargeClass:
    threshold: 600
  LongMethod:
    threshold: 60
  LongParameterList:
    functionThreshold: 6
    constructorThreshold: 7
  MethodOverloading:
    active: false
  NamedArguments:
    active: false
  TooManyFunctions:
    active: true
    thresholdInFiles: 12
    thresholdInClasses: 12

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: false
  TooGenericExceptionThrown:
    active: false

naming:
  active: true
  ConstructorParameterNaming:
    active: true
    excludes: ["**/test/**", "**/androidTest/**"]
  EnumNaming:
    active: true
    excludes: ["**/test/**", "**/androidTest/**"]
  ForbiddenClassName:
    active: false
  FunctionMaxLength:
    active: false
  FunctionMinLength:
    active: false
  FunctionNaming:
    active: true
    excludes: ["**/test/**", "**/androidTest/**"]
  FunctionParameterNaming:
    active: true
    excludes: ["**/test/**", "**/androidTest/**"]
  InvalidPackageDeclaration:
    active: true
    rootPackage: "com.vidflow"
  MemberNameEqualsClassName:
    active: false
  ObjectPropertyNaming:
    active: true
    excludes: ["**/test/**", "**/androidTest/**"]
  PackageNaming:
    active: true
    rootPackage: "com.vidflow"
  TopLevelPropertyNaming:
    active: true
    excludes: ["**/test/**", "**/androidTest/**"]
  VariableMaxLength:
    active: false
  VariableMinLength:
    active: false
  VariableNaming:
    active: true
    excludes: ["**/test/**", "**/androidTest/**"]

performance:
  active: true
  ArrayPrimitive:
    active: true
  CouldBeSequence:
    active: false
  ForEachOnRange:
    active: true
  UnnecessaryTemporaryInstantiation:
    active: true

potential-bugs:
  active: true
  CastToNullableType:
    active: false
  Deprecation:
    active: false
  DontDowncastCollectionType:
    active: false
  ExitOutsideMain:
    active: false
  IgnoredReturnValue:
    active: true
  ImplicitDefaultLocale:
    active: true
  InvalidRange:
    active: true
  MapGetWithNotNullAssertionOperator:
    active: false
  MissingPackageDeclaration:
    active: false
  NullableToStringCall:
    active: false
  UnreachableCode:
    active: true
  UnusedUnaryOperator:
    active: true
  UselessPostfixExpression:
    active: true

style:
  active: true
  ForbiddenAnnotation:
    active: false
  ForbiddenComment:
    active: true
    values:
      - "FIXME:"
      - "STOPSHIP:"
      - "TODO:"
  ForbiddenImport:
    active: false
  ForbiddenMethodCall:
    active: false
  ForbiddenSuppress:
    active: false
  ForbiddenVoid:
    active: false
  FunctionOnlyReturningConstant:
    active: false
  MagicNumber:
    active: true
    excludes: ["**/test/**", "**/androidTest/**"]
    ignoreNumbers: ["-1", "0", "1", "2"]
  MandatoryBracesIfSingleExpression:
    active: true
  MaxLineLength:
    active: true
    maxLineLength: 120
    excludes: ["**/test/**", "**/androidTest/**"]
  MayBeConst:
    active: true
  ModifierOrder:
    active: true
  NestedClassesVisibility:
    active: false
  NewLineAtEndOfFile:
    active: true
  NoTabs:
    active: false
  OptionalAbstractKeyword:
    active: true
  OptionalUnit:
    active: false
  OptionalWhenBraces:
    active: false
  PreferToOverPairSyntax:
    active: false
  ProtectedMemberInFinalClass:
    active: true
  RedundantExplicitType:
    active: false
  RedundantVisibilityModifierRule:
    active: false
  ReturnCount:
    active: true
    max: 3
    excludes: ["**/test/**", "**/androidTest/**"]
  SpacingBetweenPackageAndImports:
    active: false
  ThrowsCount:
    active: true
    max: 2
  TrailingWhitespace:
    active: false
  UnderscoresInNumericLiterals:
    active: false
  UnnecessaryAnnotationUseSiteTarget:
    active: false
  UnnecessaryApply:
    active: true
  UnnecessaryFilter:
    active: true
  UnnecessaryLet:
    active: false
  UnnecessaryParentheses:
    active: false
  UntilInsteadOfRangeTo:
    active: false
  UnusedImports:
    active: true
  UnusedParameter:
    active: true
    excludes: ["**/test/**", "**/androidTest/**"]
  UseAnyOrNoneInsteadOfFind:
    active: false
  UseArrayLiteralsInAnnotations:
    active: false
  UseCheckNotNull:
    active: false
  UseCheckOrError:
    active: false
  UseEmptyCounterpart:
    active: false
  UseIfEmptyOrIfBlank:
    active: false
  UseRequire:
    active: false
  UseRequireNotNull:
    active: false
  UselessCallOnNotNull:
    active: true
  VarCouldBeVal:
    active: true
    excludes: ["**/test/**", "**/androidTest/**"]
  WildcardImport:
    active: false
