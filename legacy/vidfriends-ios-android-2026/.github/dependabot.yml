version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Chicago"
    labels:
      - "dependencies"
      - "android"
    open-pull-requests-limit: 5
    groups:
      compose:
        patterns:
          - "androidx.compose*"
        update-types:
          - "minor"
          - "patch"
      lifecycle:
        patterns:
          - "androidx.lifecycle*"
        update-types:
          - "minor"
          - "patch"
      hilt:
        patterns:
          - "com.google.dagger*"
          - "androidx.hilt*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Chicago"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 5
