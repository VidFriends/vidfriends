name: Mark stale PRs

on:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-pr-message: 'This PR has not been updated in 14 days. Marking as stale.'
          days-before-stale: 14
          days-before-close: 7
