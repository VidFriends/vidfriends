<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VidFriends - Offline</title>
  <meta name="theme-color" content="#030712" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #030712;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
    }
    .container { text-align: center; padding: 2rem; }
    .icon { width: 64px; height: 64px; margin: 0 auto 1.5rem; color: #6b7280; }
    h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.5rem; }
    p { color: #9ca3af; margin-bottom: 1.5rem; }
    .retry-btn {
      background: #4f46e5; color: white; border: none;
      padding: 0.75rem 1.5rem; border-radius: 0.5rem;
      font-size: 0.875rem; font-weight: 500; cursor: pointer;
    }
    .retry-btn:hover { background: #4338ca; }
  </style>
</head>
<body>
  <div class="container">
    <svg class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728m-2.829-2.829a5 5 0 000-7.07m-4.243 4.243a1 1 0 010-1.414" />
    </svg>
    <h1>You're offline</h1>
    <p>Connect to the internet to use VidFriends</p>
    <button class="retry-btn" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
