name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vidfriends
          POSTGRES_PASSWORD: vidfriends
          POSTGRES_DB: vidfriends
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        options: >-
          --health-cmd "curl -sf http://localhost:9000/minio/health/live || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 9000:9000
    steps:
      - uses: actions/checkout@v4
        with:
          path: web

      - uses: actions/checkout@v4
        with:
          repository: vidfriends/backend
          path: backend

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install chromium

      - name: Run database migrations
        working-directory: backend
        run: |
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
          migrate -source file://migrations -database "postgres://vidfriends:vidfriends@localhost:5432/vidfriends?sslmode=disable" up

      - name: Create MinIO bucket
        run: |
          apt-get update && apt-get install -y curl
          curl -sf http://localhost:9000/minio/health/live
          apt-get install -y mc
          mc alias set myminio http://localhost:9000 minioadmin minioadmin
          mc mb myminio/vidfriends-videos --ignore-existing

      - name: Build and start backend
        working-directory: backend
        run: |
          go build -o server ./cmd/server
          ./server &
          sleep 3

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/api/health && break
            sleep 2
          done

      - name: Build web frontend
        working-directory: web
        run: npm run build

      - name: Start preview server
        working-directory: web
        run: |
          npm run preview &
          npx wait-on http://localhost:4173

      - name: Run E2E tests
        working-directory: web
        run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:4173
          E2E_API_URL: http://localhost:8080
          CI: "true"

      - name: Upload Playwright report
        if: always()
        working-directory: web
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Stop backend
        if: always()
        run: kill %1 || true
