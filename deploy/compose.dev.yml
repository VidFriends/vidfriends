# Development services for `pnpm dev` (TDD §6): PostgreSQL and SeaweedFS on localhost only.
# Dev-only credentials; the server refuses them in production (NFR-SEC-03).
name: vidfriends-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vidfriends
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - devpg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 3s
      retries: 20

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    entrypoint:
      - /bin/sh
      - -c
      - |
        printf '{"identities":[{"name":"dev","credentials":[{"accessKey":"devaccesskey","secretKey":"devsecretkey-not-for-production"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' > /tmp/s3.json
        exec weed server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/tmp/s3.json -volume.max=0
    ports:
      - '127.0.0.1:8333:8333'
    volumes:
      - devs3:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1']
      interval: 3s
      retries: 30

volumes:
  devpg:
  devs3:
