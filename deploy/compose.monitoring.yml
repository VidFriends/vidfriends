# Optional monitoring overlay (M5-T4, TDD §6, NFR-OPS-03): Prometheus scrapes the internal
# /metrics port of the server and worker; Grafana ships a VidFriends dashboard.
#   docker compose -f compose.yml -f compose.monitoring.yml up -d
# Nothing here is published publicly: Grafana listens on 127.0.0.1 only (use an SSH tunnel).
services:
  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      server:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '5' }

  grafana:
    image: grafana/grafana-oss:12.1.0@sha256:6ac590e7cabc2fbe8d7b8fc1ce9c9f0582177b334e0df9c927ebd9670469440f
    restart: unless-stopped
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-3000}:3000'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on: [prometheus]
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '5' }

volumes:
  prometheus_data:
  grafana_data:
